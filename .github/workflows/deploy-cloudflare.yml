name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    # Opt-in. Set the repository variable CLOUDFLARE_PAGES_DEPLOY to "true" and
    # add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to turn
    # this on. Until then the job is skipped, so pushes never fail.
    if: ${{ vars.CLOUDFLARE_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ai-website-builder-7lq.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=ai-website-builder --branch=main --commit-hash=${{ github.sha }} --commit-message=${{ github.event.head_commit.message }}
