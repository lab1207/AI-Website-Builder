name: Bug report
description: Something in the builder does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: The prompt you used
      description: If a generation went wrong, paste the prompt. A sample prompt is ideal — never anything personal.
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Browser console errors help a lot. Please remove anything sensitive.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not include a real birth date, key, or other personal data.
          required: true
