name: Feature request
description: Suggest an improvement to the builder
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This can work without a backend, an account, or sending user data anywhere.
          required: true
