<svg xmlns="http://www.w3.org/2000/svg" width="860" height="214" viewBox="0 0 860 214" role="img" aria-labelledby="title desc">
  <title id="title">AI Website Builder</title>
  <desc id="desc">A prism-cut A on an ember, pink, and violet gradient, beside the AI Website Builder wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A3D"/>
      <stop offset="0.52" stop-color="#FF3D81"/>
      <stop offset="1" stop-color="#7257FF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E94F22"/>
      <stop offset="0.55" stop-color="#FF3D81"/>
      <stop offset="1" stop-color="#7257FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E94F22"/>
      <stop offset="0.5" stop-color="#FF3D81"/>
      <stop offset="1" stop-color="#7257FF"/>
    </linearGradient>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#17130F" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="858" height="212" rx="30" fill="#F7F2E9" stroke="#E4DDD1"/>
  <rect x="1" y="1" width="858" height="212" rx="30" fill="url(#paper)"/>
  <circle cx="810" cy="24" r="150" fill="#FF3D81" opacity="0.055"/>
  <circle cx="775" cy="158" r="110" fill="#7257FF" opacity="0.05"/>

  <g transform="translate(52 52)">
    <rect width="94" height="94" rx="27" fill="url(#mark)"/>
    <path d="M28.4 66.5 47 23.5l18.6 43" fill="none" stroke="#fff" stroke-width="6.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37.2 53h19.6" stroke="#fff" stroke-width="6.3" stroke-linecap="round"/>
    <circle cx="70.5" cy="23.5" r="6" fill="#fff"/>
  </g>

  <text x="176" y="67" fill="#6C645A" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6">THE PROMPT-TO-WEBSITE STUDIO</text>
  <text x="174" y="124" fill="#17130F" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="48" font-weight="600" letter-spacing="-1.8">AI Website <tspan fill="url(#word)" font-style="italic" font-weight="500">Builder</tspan></text>
  <text x="176" y="161" fill="#6C645A" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">HTML · React · Vue · Next.js — previewed and published in your browser.</text>

  <rect x="52" y="181" width="756" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="808" y="198" text-anchor="end" fill="#9A9185" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.4">OPEN SOURCE <tspan fill="#CFC6B7">/</tspan> GPL-3.0</text>
</svg>
