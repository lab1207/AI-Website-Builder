    <rect x="16" y="336" width="204" height="68" rx="18" fill="#ffffff" stroke="#e4e4e8" />
    <rect x="30" y="352" width="118" height="8" rx="4" fill="#dcdfe4" />
    <circle cx="196" cy="380" r="11" fill="url(#accent)" />
    <path d="M196 374 L196 386 M192 380 L200 380" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

