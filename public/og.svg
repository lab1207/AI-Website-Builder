<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Website Builder — describe it, watch it become a real website</title>
  <desc id="desc">A warm paper editorial card with the AI Website Builder wordmark, a large headline, and a preview of a generated website.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A3D"/>
      <stop offset="0.52" stop-color="#FF3D81"/>
      <stop offset="1" stop-color="#7257FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E94F22"/>
      <stop offset="0.52" stop-color="#FF3D81"/>
      <stop offset="1" stop-color="#7257FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E94F22" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#E94F22"/>
      <stop offset="0.7" stop-color="#FF3D81"/>
      <stop offset="1" stop-color="#7257FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="site" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24152B"/>
      <stop offset="0.55" stop-color="#3A1732"/>
      <stop offset="1" stop-color="#5A1B34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FFB548" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF8757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FF5C9A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF5C9A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#17130F" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#17130F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#F5F2EC"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="40" r="330" fill="#FF3D81" opacity="0.07"/>
  <circle cx="1090" cy="560" r="280" fill="#7257FF" opacity="0.06"/>
  <circle cx="420" cy="660" r="250" fill="#E94F22" opacity="0.05"/>

  <!-- Masthead -->
  <g transform="translate(56 44)">
    <g transform="scale(0.78)">
      <rect width="48" height="48" rx="14" fill="url(#mark)"/>
      <path d="M14.5 34 24 13.5 33.5 34" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 27.5h10" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="36" cy="12" r="3.2" fill="#fff"/>
    </g>
    <text x="50" y="19" fill="#17130F" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.3">AI Website Builder</text>
    <text x="50" y="34" fill="#6C645A" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8">THE PROMPT-TO-WEBSITE STUDIO</text>
  </g>
  <text x="1144" y="56" text-anchor="end" fill="#6C645A" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">OPEN SOURCE · GPL-3.0</text>
  <text x="1144" y="73" text-anchor="end" fill="#9A9185" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8">EST. 2026</text>
  <rect x="56" y="94" width="1088" height="1" fill="#DCD4C7"/>

  <!-- Headline -->
  <text x="56" y="202" fill="#17130F" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" letter-spacing="-3">Describe it.</text>
  <text x="56" y="276" fill="#17130F" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" letter-spacing="-3">Watch it become</text>
  <text x="56" y="350" fill="#17130F" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" letter-spacing="-3">a <tspan fill="url(#accent)" font-style="italic" font-weight="500">real</tspan> website.</text>

  <text x="58" y="404" fill="#6C645A" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Multi-page builds, live preview, diffable versions, and one-click</text>
  <text x="58" y="430" fill="#6C645A" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500">publishing. Your key. Your model. No backend.</text>

  <!-- Chips -->
  <g font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.2">
    <g transform="translate(56 468)">
      <rect width="104" height="30" rx="15" fill="#FFFDF9" stroke="#E4DDD1"/>
      <circle cx="16" cy="15" r="3" fill="#E94F22"/>
      <text x="27" y="19" fill="#3F3932">6 providers</text>
    </g>
    <g transform="translate(170 468)">
      <rect width="112" height="30" rx="15" fill="#FFFDF9" stroke="#E4DDD1"/>
      <circle cx="16" cy="15" r="3" fill="#FF3D81"/>
      <text x="27" y="19" fill="#3F3932">4 frameworks</text>
    </g>
    <g transform="translate(292 468)">
      <rect width="94" height="30" rx="15" fill="#FFFDF9" stroke="#E4DDD1"/>
      <circle cx="16" cy="15" r="3" fill="#7257FF"/>
      <text x="27" y="19" fill="#3F3932">multi-page</text>
    </g>
    <g transform="translate(396 468)">
      <rect width="100" height="30" rx="15" fill="#FFFDF9" stroke="#E4DDD1"/>
      <circle cx="16" cy="15" r="3" fill="#0F8A67"/>
      <text x="27" y="19" fill="#3F3932">no backend</text>
    </g>
  </g>

  <g transform="translate(56 545)" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="20" fill="#17130F" font-size="11" font-weight="700" letter-spacing="1.2">GEMINI</text>
    <text x="72" y="20" fill="#9A9185" font-size="11" font-weight="700">/</text>
    <text x="88" y="20" fill="#17130F" font-size="11" font-weight="700" letter-spacing="1.2">OPENAI</text>
    <text x="157" y="20" fill="#9A9185" font-size="11" font-weight="700">/</text>
    <text x="173" y="20" fill="#17130F" font-size="11" font-weight="700" letter-spacing="1.2">OPENROUTER</text>
    <text x="274" y="20" fill="#9A9185" font-size="11" font-weight="700">/</text>
    <text x="290" y="20" fill="#17130F" font-size="11" font-weight="700" letter-spacing="1.2">NVIDIA</text>
    <text x="355" y="20" fill="#9A9185" font-size="11" font-weight="700">/</text>
    <text x="371" y="20" fill="#17130F" font-size="11" font-weight="700" letter-spacing="1.2">ANTHROPIC</text>
    <text x="468" y="20" fill="#9A9185" font-size="11" font-weight="700">/</text>
    <text x="484" y="20" fill="#17130F" font-size="11" font-weight="700" letter-spacing="1.2">COMPATIBLE</text>
  </g>

  <!-- Preview card -->
  <g transform="translate(760 142)" filter="url(#shadow)">
    <rect width="388" height="404" rx="18" fill="#FFFDF9" stroke="#E4DDD1"/>
    <path d="M0 18A18 18 0 0 1 18 0h352a18 18 0 0 1 18 18v24H0z" fill="#F7F3EC"/>
    <circle cx="20" cy="21" r="3.5" fill="#FF5F57"/>
    <circle cx="32" cy="21" r="3.5" fill="#FEBC2E"/>
    <circle cx="44" cy="21" r="3.5" fill="#28C840"/>
    <rect x="76" y="15" width="190" height="12" rx="6" fill="#FFFDF9" stroke="#E4DDD1"/>
    <text x="171" y="24" text-anchor="middle" fill="#9A9185" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="7" font-weight="600">hush.studio</text>
    <rect x="282" y="12" width="88" height="18" rx="9" fill="#17130F"/>
    <text x="326" y="24" text-anchor="middle" fill="#F8F3EA" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="700">Publish</text>

    <!-- Generated site -->
    <g transform="translate(13 54)">
      <rect width="362" height="330" rx="12" fill="url(#site)"/>
      <circle cx="300" cy="62" r="120" fill="url(#glow2)"/>
      <circle cx="282" cy="112" r="86" fill="url(#glow)"/>
      <text x="26" y="32" fill="#FFF8F1" font-family="Fraunces, Georgia, serif" font-size="18" font-style="italic">hush.</text>
      <g font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="7" font-weight="600">
        <text x="150" y="30" fill="#FFF8F1" opacity="0.55">STUDIO</text>
        <text x="210" y="30" fill="#FFF8F1" opacity="0.55">SERVICES</text>
        <text x="274" y="30" fill="#FFF8F1" opacity="0.55">JOURNAL</text>
        <rect x="318" y="18" width="20" height="20" rx="10" fill="#FFF8F1" opacity="0.14"/>
        <text x="328" y="31" text-anchor="middle" fill="#FFF8F1" font-size="10">+</text>
      </g>
      <line x1="26" y1="46" x2="336" y2="46" stroke="#FFF8F1" stroke-opacity="0.12"/>
      <text x="26" y="86" fill="#FFBF9B" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.7">A QUIETER KIND OF STAY</text>
      <text x="26" y="132" fill="#FFF8F1" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="500" letter-spacing="-1.2">Sleep without</text>
      <text x="26" y="166" fill="#FFF8F1" font-family="Fraunces, Georgia, serif" font-size="34" font-style="italic" font-weight="500" letter-spacing="-1.2">counting.</text>
      <text x="26" y="196" fill="#FFF8F1" opacity="0.62" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5">A small studio for deep rest, warm light, and</text>
      <text x="26" y="209" fill="#FFF8F1" opacity="0.62" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5">mornings that arrive gently.</text>
      <rect x="26" y="226" width="76" height="24" rx="12" fill="#FFBF9B"/>
      <text x="64" y="241" text-anchor="middle" fill="#3A1732" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="7.5" font-weight="800">BOOK A STAY</text>
      <g transform="translate(26 270)" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif">
        <line x1="0" y1="0" x2="310" y2="0" stroke="#FFF8F1" stroke-opacity="0.12"/>
        <text x="0" y="18" fill="#FFF8F1" opacity="0.4" font-size="6.5">01</text>
        <text x="20" y="18" fill="#FFF8F1" opacity="0.8" font-size="8" font-weight="600">Quiet rooms</text>
        <text x="110" y="18" fill="#FFF8F1" opacity="0.4" font-size="6.5">02</text>
        <text x="130" y="18" fill="#FFF8F1" opacity="0.8" font-size="8" font-weight="600">Slow mornings</text>
        <text x="230" y="18" fill="#FFF8F1" opacity="0.4" font-size="6.5">03</text>
        <text x="250" y="18" fill="#FFF8F1" opacity="0.8" font-size="8" font-weight="600">Deep rest</text>
      </g>
    </g>
  </g>

  <text x="1144" y="592" text-anchor="end" fill="#9A9185" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.4">ai-website-builder-7lq.pages.dev</text>
</svg>
