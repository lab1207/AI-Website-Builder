      <stop offset="0%" stop-color="#2f6bff" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7f7f9" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#101828" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f4f4f6" />
  <circle cx="1050" cy="90" r="260" fill="#2f6bff" opacity="0.06" />
  <circle cx="120" cy="580" r="240" fill="#7c5cff" opacity="0.05" />

