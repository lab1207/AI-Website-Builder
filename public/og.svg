  <!-- Copy -->
  <g transform="translate(760 152)">
    <rect x="0" y="0" width="50" height="50" rx="13" fill="url(#accent)" />
    <path d="M25 13 L19 27 h7 l-5 12 12-17h-7l5-9z" fill="#ffffff" />

    <text x="0" y="112" fill="#16161a" font-size="50" font-weight="700" letter-spacing="-1.8">AI Website</text>
