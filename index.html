<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Website Builder — Generate a website from a prompt</title>
    <meta
      name="description"
      content="Describe a website in plain English and generate complete HTML, CSS, and JavaScript with live preview, conversational editing, and one-click ZIP export. Runs entirely in your browser."
    />
    <meta name="author" content="Vaibhav Hajare" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      GitHub Pages cannot serve custom response headers, so the policy is also
      declared here. Hosts that do support headers send the same policy in
      _headers, vercel.json, and netlify.toml.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://openrouter.ai https://integrate.api.nvidia.com https://api.anthropic.com https:; manifest-src 'self'"
    />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Website Builder" />
    <meta property="og:title" content="AI Website Builder — Generate a website from a prompt" />
    <meta
      property="og:description"
      content="Describe a website in plain English and generate complete HTML, CSS, and JavaScript with live preview, conversational editing, and one-click ZIP export."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The AI Website Builder interface: a chat panel on the left and a live preview on the right"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Website Builder — Generate a website from a prompt" />
    <meta
      name="twitter:description"
      content="Prompt to website, with live preview and one-click export. Runs entirely in your browser."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AI Website Builder",
        "description": "Generate complete HTML, CSS, and JavaScript websites from natural language, with live preview and one-click ZIP export.",
        "url": "%SITE_URL%/",
        "applicationCategory": "DeveloperApplication",
        "keywords": "ai website builder, prompt to website, html css javascript generator, live preview, website generator, static site generator, gemini",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "author": {
          "@type": "Person",
          "name": "Vaibhav Hajare",
          "url": "https://github.com/lab1207"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          max-width: 32rem;
          margin: 20vh auto;
          padding: 0 1.5rem;
          color: #eceef1;
          font-family: system-ui, sans-serif;
          line-height: 1.6;
        "
      >
        <h1 style="font-weight: 500">AI Website Builder</h1>
        <p>
          This builder runs entirely in your browser and needs JavaScript. Enable it and reload
          to start building.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
