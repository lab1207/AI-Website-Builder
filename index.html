<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    />

    <meta name="theme-color" content="#f5f2ec" />
    <meta name="color-scheme" content="light dark" />

    <!--
      GitHub Pages cannot serve custom response headers, so the policy is also
      declared here. Hosts that support headers send the same policy in
      public/_headers, vercel.json, and netlify.toml.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://openrouter.ai https://integrate.api.nvidia.com https://api.anthropic.com https:; manifest-src 'self'"
    />

    <!-- Set the saved theme before the first paint, so dark mode never flashes. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ai-website-builder:theme:v1');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#0d0b0a' : '#f5f2ec');
          }
        } catch (error) {}
      })();
    </script>
